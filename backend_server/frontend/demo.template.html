function dateParts(value){if(!value)return null;const d=new Date(value);if(Number.isNaN(d.valueOf()))return null;const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:state.zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return {day:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute};}
function dateText(value){const p=dateParts(value);return p?p.day+' '+p.time:'未提供';}
function todayKey(now=new Date()){return dateParts(now.toISOString()).day;}
function recordDay(a,kev=false){if(kev)return a.dateAdded||null;const p=a.published;if(p?.utc)return dateParts(p.utc)?.day||null;if(p?.status==='date_only')return p.date||p.raw||null;return null;}
function matchesDay(a,kev=false){return state.date==='undated'?!recordDay(a,kev):recordDay(a,kev)===state.date;}
function dayRows(id=state.source){const kev=id==='cisa_kev';return (kev?DATA.kev:DATA.articles).filter(a=>(kev||id==='all'||a.source_id===id)&&matchesDay(a,kev));}
function currentScope(){return state.source==='cisa_kev'?DATA.kev:DATA.articles.filter(a=>state.source==='all'||a.source_id===state.source);}
function zoneName(){return state.zone==='Europe/Brussels'?'比利时':state.zone==='Asia/Shanghai'?'北京时间':'UTC';}
function monthCells(month){const [year,m]=month.split('-').map(Number),start=(new Date(Date.UTC(year,m-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(year,m,0)).getUTCDate();return [...Array(start).fill(null),...Array.from({length:days},(_,i)=>month+'-'+String(i+1).padStart(2,'0'))];}
function setDate(day,followToday=false){state.date=day;state.followToday=followToday;if(day!=='undated')state.month=day.slice(0,7);state.page=1;state.query='';state.filter='all';$('search').value='';$('content-filter').value='all';render();}
function moveMonth(delta){const [y,m]=state.month.split('-').map(Number),next=new Date(Date.UTC(y,m-1+delta,1));state.month=next.toISOString().slice(0,7);renderCalendar();}
function renderCalendar(){const grid=$('calendar-grid'),counts=new Map(),kev=state.source==='cisa_kev',rows=currentScope(),today=todayKey();let unknown=0;for(const a of rows){const day=recordDay(a,kev);if(day)counts.set(day,(counts.get(day)||0)+1);else unknown++;}grid.replaceChildren();const [y,m]=state.month.split('-');$('calendar-month').textContent=y+' 年 '+Number(m)+' 月';for(const day of monthCells(state.month)){if(!day){grid.append(el('span'));continue;}const count=counts.get(day)||0,b=el('button','calendar-day '+(count?'has-news':'no-news')+(day===today?' is-today':''));b.type='button';b.setAttribute('aria-label',day+'，'+count+(kev?' 条 KEV 记录':' 篇新闻')+(day===today?'，今天':''));b.setAttribute('aria-pressed',String(day===state.date));if(day===today)b.setAttribute('aria-current','date');b.append(el('span','day-number',Number(day.slice(-2))),el('span','day-count',count?count+(kev?' 条':' 篇'):'—'));b.addEventListener('click',()=>setDate(day,day===todayKey()));grid.append(b);}$('undated').hidden=!unknown;$('undated').textContent='日期未确定 · '+unknown;$('undated').setAttribute('aria-pressed',String(state.date==='undated'));$('calendar-note').textContent=(state.source==='all'?'全部新闻':sourceName(sources.get(state.source)))+' · '+(kev?'按加入目录日期计数':'按'+zoneName()+'日期计数')+'；数量不受搜索和获取状态筛选影响。空白日期表示快照中没有收录。';}
function renderDayHeading(){const isToday=state.date===todayKey(),undated=state.date==='undated';$('day-heading').textContent=undated?'日期未确定的记录':isToday?'今日安全新闻':'往日安全新闻';$('selected-date').textContent=undated?'尚不能归入具体日期':state.date+(isToday?' · 今天':'')+' · '+zoneName();$('scope-note').textContent='累计已收集 '+fmt.format(DATA.articles.length)+' 篇新闻 · '+fmt.format(DATA.revision_count)+' 个内容版本 · 切换日历查看其他日期';$('metric-news-label').textContent=undated?'未确定日期的新闻':'当日新闻';document.title=(undated?'日期未确定':isToday?'今天':state.date)+' · 安全日报';}
function dot(status){return el('i','dot'+(status==='failed'?' bad':status==='partial'?' warn':''));}
function sourceCount(id){return dayRows(id).length;}
function fillMetrics(){const a=dayRows('all'),body=a.filter(x=>x.content_kind==='article_body').length,excerpt=a.filter(x=>['rss_excerpt','feed_content'].includes(x.content_kind)).length,title=a.filter(x=>x.content_kind==='title_only').length; $('metric-news').textContent=fmt.format(a.length);$('metric-news-foot').textContent=new Set(a.map(x=>x.source_id)).size+' 个新闻来源 · 累计 '+fmt.format(DATA.articles.length)+' 篇';$('metric-body').textContent=fmt.format(body);$('metric-body-foot').textContent='正文覆盖率 '+(100*body/Math.max(a.length,1)).toFixed(1)+'%';$('body-progress').style.width=(100*body/Math.max(a.length,1))+'%';$('metric-excerpt').textContent=fmt.format(excerpt);$('metric-excerpt-foot').textContent='另有 '+title+' 篇仅保留标题和链接';$('metric-kev').textContent=fmt.format(dayRows('cisa_kev').length);$('metric-kev-foot').textContent='目录累计 '+fmt.format(DATA.kev.length)+' 条 · 独立于新闻';$('collected-at').textContent=dateText(DATA.collected_at);}
function makeTabs(){const tabs=$('source-tabs');tabs.replaceChildren();const options=[{id:'all',name:'全部新闻'},...DATA.sources];for(const s of options){const b=el('button','tab');b.type='button';b.id='tab-'+s.id;b.setAttribute('role','tab');b.setAttribute('aria-controls','source-panel');b.setAttribute('aria-selected',String(s.id===state.source));b.tabIndex=s.id===state.source?0:-1;if(s.id!=='all')b.append(dot(s.latest_run.status));b.append(el('span','',sourceName(s)),el('span','tabcount',fmt.format(sourceCount(s.id))));b.addEventListener('click',()=>selectSource(s.id));b.addEventListener('keydown',e=>{const idx=options.findIndex(x=>x.id===s.id);let next;if(e.key==='ArrowRight')next=(idx+1)%options.length;if(e.key==='ArrowLeft')next=(idx-1+options.length)%options.length;if(e.key==='Home')next=0;if(e.key==='End')next=options.length-1;if(next!==undefined){e.preventDefault();selectSource(options[next].id);$('tab-'+options[next].id).focus();$('tab-'+options[next].id).scrollIntoView({block:'nearest',inline:'nearest'});}});tabs.append(b);}}
function selectSource(id){state.source=id;state.page=1;state.filter='all';$('content-filter').value='all';$('content-filter').disabled=id==='cisa_kev';for(const tab of $('source-tabs').children){const active=tab.id==='tab-'+id;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;}$('source-panel').setAttribute('aria-labelledby','tab-'+id);$('source-meta').open=false;render();}
function sourceMetaField(label,value,wide=false){const d=el('div',wide?'wide':'');d.append(el('span','',label));const b=el('b');if(value instanceof Node)b.append(value);else b.textContent=value??'未提供';d.append(b);return d;}
function renderSource(){const all=state.source==='all',s=sources.get(state.source),health=$('source-health'),grid=$('source-grid');grid.replaceChildren();health.replaceChildren();health.className='health';$('source-title').replaceChildren(el('span','',all?'全部新闻':sourceName(s)),el('small','',fmt.format(sourceCount(state.source))+(state.source==='cisa_kev'?' 条 · 当日入库':' 篇 · 所选日期')));grid.append(sourceMetaField('当前日期',state.date==='undated'?'日期未确定':state.date),sourceMetaField('累计收集',fmt.format(all?DATA.articles.length:s.id==='cisa_kev'?DATA.kev.length:DATA.articles.filter(a=>a.source_id===s.id).length)+(s?.id==='cisa_kev'?' 条目录记录':' 篇新闻')));if(all){$('source-description').textContent='保留每篇原始报道；同一事件的不同来源尚未自动合并。';const available=DATA.sources.filter(x=>['ok','partial'].includes(x.latest_run.status)).length;health.append(dot('ok'),el('span','',available+' / '+DATA.sources.length+' 个来源可用'));grid.append(sourceMetaField('快照生成时间',dateText(DATA.generated_at)),sourceMetaField('采集窗口','各 RSS 当前返回的最近条目'),sourceMetaField('中文处理','优先显示中文译文；展开保留原文'));}else{const r=s.latest_run;const descriptions={freebuf:'本次未取得文章，其他来源继续正常收集。',thehackernews:'RSS 摘要已保存；文章页访问受限，正文获取已暂停。',seebug:'RSS 摘要已保存；文章页返回错误，正文获取已暂停。',anquanke:'正文缺失的条目保留标题与链接；无时区的时间暂按北京时间推定。',cisa_kev:'按官方加入目录日期查看；不代表漏洞发生日期，与新闻分别统计。'};$('source-description').textContent=descriptions[s.id]||'已保存来源链接、原始时间与可追溯的内容 metadata。';health.className+=' '+(r.status==='failed'?'error':r.status==='partial'?'warning':'');health.append(dot(r.status),el('span','',r.status==='failed'?'来源不可用':r.status==='partial'?'部分内容缺失':'采集正常'));grid.append(sourceMetaField('原始名称',s.name),sourceMetaField('来源 ID',s.id),sourceMetaField('接入方式',s.kind==='kev'?'JSON 数据目录':'RSS + 文章页'),sourceMetaField('最近采集',dateText(r.finished_at)),sourceMetaField('原始入口',link(s.url,s.url),true));if(r.error)grid.append(sourceMetaField('失败原因',(errorLabels[r.error]||r.error)+'；'+(r.endpoint_attempts||[]).map(x=>x.error||x.status).join(' / '),true));if(s.timezone_hint)grid.append(sourceMetaFiel function filtered(){const kev=state.source==='cisa_kev';let rows=dayRows();const q=state.query.toLowerCase();if(q)rows=rows.filter(a=>(kev?[a.cveID,a.vendorProject,a.product,a.vulnerabilityName,a.shortDescription]:[a.title,a.title_zh,a.guid,sources.get(a.source_id)?.name]).filter(Boolean).join(' ').toLowerCase().includes(q));if(!kev&&state.filter!=='all')rows=rows.filter(a=>state.filter==='rss_excerpt'?['rss_excerpt','feed_content'].includes(a.content_kind):a.content_kind===state.filter);rows.sort((a,b)=>{const av=state.sort==='collected'?a.last_seen_at:kev?a.dateAdded:a.published?.utc;const bv=state.sort==='collected'?b.last_seen_at:kev?b.dateAdded:b.published?.utc;return (bv||'').localeCompare(av||'')||(kev?a.cveID.localeCompare(b.cveID):b.id-a.id);});return rows;}
function metadataField(label,value,wide=false,mono=false){const d=el('div',wide?'wide':'');d.append(el('dt','',label));const dd=el('dd',mono?'mono':'');if(value instanceof Node)dd.append(value);else dd.textContent=value===null||value===undefined||value===''?'未提供':String(value);d.append(dd);return d;}
function newsDetails(a){const box=el('div','detail-content');box.append(el('h3','detail-heading','文章原始信息 · #'+a.id));const dl=el('dl','metadata');const fields=[['标题（原文）',a.title,true],['标题（中文）',a.title_zh||'等待翻译',true],['翻译状态',translationLabel(a)],['翻译模型',a.translation?.model||'未使用'],['翻译时间',a.translation?.translated_at?dateText(a.translation.translated_at):'未翻译'],['来源 / 文章 ID',a.source_id+' / '+a.id],['原文语言',a.language==='zh'?'中文':a.language||'未提供'],['内容版本',a.revision_count+' 个版本'],['来源原始发布时间',a.published?.raw],['标准 UTC 时间',a.published?.utc],['时区状态',timeLabels[a.published?.status]||a.published?.status],['首次发现',dateText(a.first_seen_at)],['最近采集',dateText(a.last_seen_at)],['来源明确更新时间',a.modified?.utc||'来源未提供'],['事件发生时间',a.happened_at||'尚未确认'],['内容类型',a.content_kind],['正文 / 证据 / 引用',fmt.format(a.text_length)+' 字符 · '+a.evidence_count+' 片段 · '+a.reference_count+' 链接'],['HTTP 状态 / 提取位置',(a.page_http_status||'未请求或未取得响应')+' / '+(a.selector||'—')],['原始时区字段',a.published?.source_timezone],['抓取记录 ID','RSS '+(a.feed_fetch_id||'—')+' / 页面 '+(a.page_fetch_id||'—')]];fields.forEach(f=>dl.append(metadataField(...f)));dl.append(metadataField('原文链接',link(a.url,a.url),true),metadataField('GUID',a.guid,true,true),metadataField('正文 SHA-256',a.content_sha256,true,true),metadataField('版本 SHA-256',a.revision_hash,true,true));if(a.body_error)dl.append(metadataField('正文获取说明',errorLabels[a.body_error]||a.body_error,true));box.append(dl,el('div','detail-info','这里显示真实采集信息，不展示生成式摘要。发生时间与报道时间分别保存，未确认的信息保持为空。'));return box;}
function kevDetails(a){const box=el('div','detail-content');box.append(el('h3','detail-heading','漏洞目录原始信息 · '+a.cveID));const dl=el('dl','metadata');[['漏洞名称（原文）',a.vulnerabilityName,true],['漏洞名称（中文）',a.title_zh||'等待翻译',true],['翻译状态',translationLabel(a)],['翻译模型',a.translation?.model||'未使用'],['CVE ID',a.cveID],['厂商 / 产品',a.vendorProject+' / '+a.product],['加入目录的日期',a.dateAdded],['处置截止日期',a.dueDate],['已知勒索活动使用',a.knownRansomwareCampaignUse],['首次采集',dateText(a.first_seen_at)]].forEach(f=>dl.append(metadataField(...f)));dl.append(metadataField('漏洞描述（原文）',a.shortDescription,true),metadataField('建议措施（原文）',a.requiredAction,true),metadataField('来源备注',a.notes,true),metadataField('官方目录',link('打开 CISA KEV 原始目录','https://www.cisa.gov/known-exploited-vulnerabilities-catalog'),true));box.append(dl,el('div','detail-info','加入目录的日期不代表漏洞发生时间。该记录属于基线目录，不作为当天新增新闻。'));return box;}
function renderRows(rows){const kev=state.source==='cisa_kev';$('table-head').replaceChildren();const head=el('tr');const headers=kev?['漏洞 / 产品','加入目录','勒索活动使用','目录类型','原文与详情']:['新闻 / 来源','发布时间','获取状态','内容量','原文与详情'];headers.forEach((x,i)=>head.append(el('th',['col-title','col-date','col-status','col-size','col-detail'][i],x)));$('table-head').append(head);const body=$('article-list');body.replaceChildren();rows.forEach((a,idx)=>{const tr=el('tr','article-row'),detail=el('tr','detail-row');detail.hidden=true;detail.id='meta-'+(kev?a.cveID:a.id);const title=el('td'),time=el('td'),status=el('td'),size=el('td'),action=el('td');if(kev){const headline=link(a.cveID+' · '+displayTitle(a),'https://www.cisa.gov/known-exploited-vulnerabilities-catalog');headline.className='article-title';title.append(headline,el('div','article-sub',translationLabel(a)+' · 展开查看原文'));time.append(el('div','time-main',a.dateAdded),el('div','time-sub','仅精确到日期'));status.append(el('span','status'+(a.knownRansomwareCampaignUse==='Known'?' excerpt':''),a.knownRansomwareCampaignUse==='Known'?'已知用于勒索':'未确认'));size.append(el('div','size-main','漏洞目录'),el('div','size-sub','与新闻分开统计'));}else{const headline=link(displayTitle(a),a.url);headline.className='article-title';const sub=el('div','article-sub');sub.append(el('span','',sourceName(sources.get(a.source_id))),el('span','separator','·'),el('span','lang',translationLabel(a)));title.append(headline,sub);const dt=dateParts(a.published?.utc);time.append(el('div','time-main',dt?dt.day:(a.published?.status==='date_only'?(a.published.date||a.published.raw):'时间未确定')),el('div','time-sub',dt?dt.time+(a.published.status==='source_timezone_assumed'?' · 时区推定':''):(a.published?.status==='date_only'?'仅精确到日期':'来源未提供可确定的时间')));status.append(el('span','status'+(a.content_kind==='title_only'?' missing':a.content_kind==='article_body'?'':' excerpt'),labels[a.content_kind]||'未分类'));size.append(el('div','size-main',fmt.format(a.text_length)+' 字符'),el('div','size-sub',a.evidence_count+' 个证据片段'));}const toggle=el('button','detail-btn','展开原文 ↗');toggle.type='button';toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls',detail.id);toggle.setAttribute('aria-label','查看 '+(kev?a.cveID:displayTitle(a))+' 的原文与详情');toggle.addEventListener('click',()=>{detail.hidden=!detail.hidden;toggle.setAttribute('aria-expanded',String(!detail.hidden));toggle.textContent=detail.hidden?'展开原文 ↗':'收起 ↑';if(!detail.hidden&&!detail.childNodes.length){const td=el('td');td.colSpan=5;td.append(kev?kevDetails(a):newsDetails(a));detail.append(td);}});action.append(toggle);tr.append(title,time,status,size,action);body.append(tr,detail);});}
function render(){renderDayHeading();fillMetrics();for(const tab of $('source-tabs').children)tab.querySelector('.tabcount').textContent=fmt.format(sourceCount(tab.id.slice(4)));renderCalendar();renderSource();const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/state.pageSize));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.pageSize;renderRows(rows.slice(start,start+state.pageSize));$('results-note').textContent=(state.date==='undated'?'日期未确定':state.date)+' · 显示 '+fmt.format(rows.length)+' 条'+(state.source==='cisa_kev'?' KEV 记录':'新闻')+' · '+(state.source==='cisa_kev'?'日期为加入目录日期':state.zone==='Europe/Brussels'?'发布时间按比利时时区显示（自动处理夏令时）':state.zone==='Asia/Shanghai'?'发布时间按北京时间显示':'发布时间按 UTC 显示');$('page-info').textContent=rows.length?'第 '+(start+1)+'–'+Math.min(start+state.pageSize,rows.length)+' 条 / 共 '+fmt.format(rows.length)+' 条':'共 0 条';$('page-number').textContent=state.page+' / '+pages;$('previous').disabled=state.page===1;$('next').disabled=state.page===pages;$('table-wrap').hidden=!rows.length;$('empty').hidden=!!rows.length;const failed=state.source!=='all'&&sources.get(state.source)?.latest_run.status==='failed';$('empty-title').textContent=failed?'这个来源暂时还没有收集到内容':state.query||state.filter!=='all'?'没有匹配的记录':state.date==='undated'?'没有日期未确定的记录':'这一天暂无收录';$('empty-description').textContent=failed?'本次访问返回错误。来源失败会被单独记录，不影响其他来源；可展开来源 metadata 查看原因。':state.query||state.filter!=='all'?'试试清空关键词或切换获取状态。':'请选择其他日期或来源。这里展示已有采集快照，不代表当天没有安全事件。';}
$('search').addEventListener('input',e=>{state.query=e.target.value.trim();state.page=1;render();});$('content-filter').addEventListener('change',e=>{state.filter=e.target.value;state.page=1;render();});$('sort').addEventListener('change',e=>{state.sort=e.target.value;state.page=1;render();});$('timezone').addEventListener('change',e=>{state.zone=e.target.value;if(state.followToday){state.date=todayKey();state.month=state.date.slice(0,7);}state.page=1;render();});$('previous').addEventListener('click',()=>{state.page--;render();});$('next').addEventListener('click',()=>{state.page++;render();});state.date=todayKey();state.month=state.date.slice(0,7);$('month-previous').addEventListener('click',()=>moveMonth(-1));$('month-next').addEventListener('click',()=>moveMonth(1));$('back-today').addEventListener('click',()=>setDate(todayKey(),true));$('undated').addEventListener('click',()=>setDate('undated'));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();state.source='all';$('content-filter').disabled=false;makeTabs();$('source-panel').setAttribute('aria-labelledby','tab-all');setDate(todayKey(),true);window.scrollTo({top:0});});function refreshToday(){if(state.followToday&&state.date!==todayKey())setDate(todayKey(),true);}setInterval(refreshToday,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday();});makeTabs();render();
